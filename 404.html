<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity</title>

<!-- placeholder: หน้าโพสต์จริงยังไม่ถูกเรนเดอร์ จึงยังไม่ให้ Google เก็บ -->
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Gravity">
<meta property="og:type" content="website">
<meta property="og:title" content="Gravity — เชื่อมคนใกล้กัน">
<meta property="og:description" content="ดูว่าตรงไหนน้ำท่วม ฝนตก หรือมีอะไรเกิดขึ้นรอบตัวคุณ">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Kanit:wght@300;400;600&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Anuphan',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#020C18;color:#fff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;
  }
  .logo{width:72px;height:72px;border-radius:50%;overflow:hidden;margin-bottom:26px;
    box-shadow:0 0 40px rgba(255,179,0,.15),0 0 80px rgba(0,200,255,.08)}
  .logo img{width:100%;height:100%;object-fit:cover}
  .brand{font-family:'Kanit',sans-serif;font-size:1.5em;font-weight:300;letter-spacing:9px;
    margin-bottom:10px}
  .rule{width:46px;height:1px;margin:0 auto 26px;
    background:linear-gradient(90deg,transparent,#FFB300,transparent)}
  h1{font-family:'Kanit',sans-serif;font-weight:400;font-size:1.25em;line-height:1.6;
    margin-bottom:12px;max-width:22ch}
  p{color:rgba(255,255,255,.45);line-height:1.85;max-width:34ch;font-size:.97em}
  .ref{margin-top:18px;font-size:.74em;color:rgba(255,255,255,.22);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;max-width:34ch}
  .actions{display:flex;flex-direction:column;gap:11px;margin-top:34px;width:100%;max-width:290px}
  a.btn{display:block;padding:13px 20px;border-radius:999px;text-decoration:none;
    font-weight:600;font-size:.95em;transition:transform .15s,opacity .15s}
  a.btn:active{transform:scale(.98)}
  .primary{background:#FFB300;color:#020C18}
  .ghost{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.14)}
  .home{margin-top:30px;font-size:.85em}
  .home a{color:rgba(255,255,255,.35);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.14)}
  @media(prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
  <div class="logo"><img src="/logo.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>
  <div class="brand">GRAVITY</div>
  <div class="rule"></div>

  <h1 id="title">ไม่พบหน้านี้</h1>
  <p id="desc">ลิงก์อาจพิมพ์ผิดหรือถูกย้ายไปแล้ว</p>
  <div class="ref" id="ref"></div>

  <div class="actions">
    <a class="btn primary" id="store" href="https://gravityconnect.app">เปิดในแอป Gravity</a>
    <a class="btn ghost" id="other" href="https://gravityconnect.app">ดาวน์โหลดแอป</a>
  </div>

  <div class="home"><a href="/">กลับหน้าแรก</a></div>

<script>
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6761763533';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.gravity.connect';
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var path = decodeURIComponent(location.pathname.replace(/\/+$/, ''));
  var m;
  var title = document.getElementById('title');
  var desc = document.getElementById('desc');
  var ref = document.getElementById('ref');

  // /p/{postId} — โพสต์
  if ((m = path.match(/^\/p\/(.+)$/))) {
    title.textContent = 'เปิดโพสต์นี้ในแอป Gravity';
    desc.textContent = 'ตอนนี้ยังต้องเปิดผ่านแอป — อีกไม่นานหน้านี้จะแสดงเนื้อหาให้อ่านได้เลย';
    ref.textContent = m[1];
  }
  // /a/{areaId} — พื้นที่
  else if ((m = path.match(/^\/a\/(.+)$/))) {
    var name = m[1].split('/').pop() || m[1];
    title.textContent = 'ดูว่าเกิดอะไรขึ้นที่ ' + name;
    desc.textContent = 'เปิดแอป Gravity เพื่อดูโพสต์ล่าสุดในพื้นที่นี้';
    ref.textContent = m[1];
  }
  // /@handle — โปรไฟล์
  else if ((m = path.match(/^\/@(.+)$/))) {
    title.textContent = '@' + m[1] + ' บน Gravity';
    desc.textContent = 'เปิดแอป Gravity เพื่อดูโปรไฟล์นี้';
  }
  // อย่างอื่น = 404 จริง — ไม่ต้องชวนโหลดแอปแรงๆ
  else {
    document.getElementById('store').className = 'btn ghost';
  }

  var store = document.getElementById('store');
  var other = document.getElementById('other');
  store.href = isIOS ? APP_STORE : PLAY;
  other.href = isIOS ? PLAY : APP_STORE;
  other.textContent = isIOS ? 'ใช้ Android?' : 'ใช้ iPhone?';

  document.title = title.textContent + ' — Gravity';
})();
</script>
</body>
</html>
